# apriltag_bringup.service dayaniklilik drop-in'i (2026-10-20, 19_10 ucus analizi)
# Kurulum:
#   sudo cp robust.conf /etc/systemd/system/apriltag_bringup.service.d/robust.conf
#   sudo systemctl daemon-reload && sudo systemctl restart apriltag_bringup
[Service]
# Kernel OOM bir node'u oldurdugunde TUM servisi durdurma (varsayilan 'stop').
# 19_10'da car_detector'in OOM'u serial/apriltag/radar dahil her seyi ~100 s dusurdu.
OOMPolicy=continue
# Durdurmada radar SDK takilmasi 90 s (varsayilan) bekletiyordu; kayitlar zaten
# hrvs join'den ONCE kapaniyor, 15 s yeterli.
TimeoutStopSec=15
