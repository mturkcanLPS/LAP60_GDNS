# apriltag_bringup.service: DDS'i yalniz loopback'li ozel ag alaninda calistir (2026-10-20)
# Kurulum:
#   sudo cp dds_yerel.conf /etc/systemd/system/apriltag_bringup.service.d/dds_yerel.conf
#   sudo systemctl daemon-reload && sudo systemctl restart apriltag_bringup
# Geri almak: dosyayi sil + daemon-reload + restart.
#
# Neden: Fast DDS 2.6.11'de host_id = MD5(o anki TUM IPv4 adresleri) (IP yoksa 127.1),
# paylasilan bellek (SHM) yalniz host_id'si AYNI katilimcilar arasinda kullanilir
# (SHMLocator::is_shm_and_from_this_host). 20_10 12:31 acilisinda realsense WiFi IP
# almadan (12:31:33, host_id 7f01), abone node'lar aldiktan sonra (12:31:36-40,
# host_id f829) basladi -> kareler UDP'ye dustu, RcvbufErrors ~300/s, infra2 30 -> 20 Hz,
# renkli 15 -> 8.5 Hz. Ayni sey sahada WiFi/hotspot baglanip koparken veya car_detector
# respawn olurken de olur.
# PrivateNetwork=yes: serviste yalniz lo var -> host_id hep 7f01, SHM her kosulda.
# unshare -rn ile olculdu: lo-only 15.0 Hz / UDP kaybi 0; araya IP girince 11.8 Hz /
# 20 sn'de 1680 RcvbufErrors.
# Bedeli: servisin topic'leri disaridan (masaustu ros2 CLI, rviz, baska makine)
# GORULMEZ. Izleme syslog'dan yapilir (lps_bringup/scripts/servis_izle.sh).
# Serviste ag kullanan kod yok (seri port, USB kamera/radar ag degil).
[Service]
PrivateNetwork=yes
